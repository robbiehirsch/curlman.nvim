name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  luacheck:
    name: lint (luacheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install luacheck
      - run: luacheck lua/

  smoke:
    name: nvim ${{ matrix.nvim }}
    runs-on: ubuntu-latest
    # stable is the gate; nightly is advisory (upstream breakage shouldn't red the badge)
    continue-on-error: ${{ matrix.nvim == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        nvim: ["stable", "nightly"]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: require + setup + commands exist
        run: |
          nvim --headless -u NONE \
            -c "set runtimepath+=." \
            -c "lua require('curlman').setup({})" \
            -c "lua assert(vim.fn.exists(':Curlman') == 2, ':Curlman not created')" \
            -c "lua assert(vim.fn.exists(':CurlmanUI') == 2, ':CurlmanUI not created')" \
            -c "lua require('curlman.postman'); require('curlman.curl'); require('curlman.workspace'); require('curlman.telescope')" \
            -c "qa!"
      - name: parse the bundled sample collection
        run: |
          nvim --headless -u NONE \
            -c "set runtimepath+=." \
            -c "lua local f=vim.api.nvim_get_runtime_file('lua/curlman/sample/demo.postman_collection.json',false)[1]; local c=require('curlman.postman').parse_collection(io.open(f):read('*a'),'demo'); assert(#c.requests==5, 'expected 5 requests, got '..#c.requests)" \
            -c "qa!"

  # Formatting is enforced with stylua (config in stylua.toml). The codebase is
  # hand-formatted; run `stylua lua/` locally once to normalize it, commit, then
  # uncomment this job to gate on formatting.
